name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: 📱 Generate Native Android Project
        working-directory: frontend
        run: |
          npx expo prebuild --platform android --clean --no-install
          # Ensure Gradle has 4GB heap space
          if grep -q "org.gradle.jvmargs" android/gradle.properties; then
            sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError/g' android/gradle.properties
          else
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          fi
          chmod +x android/gradlew

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🏗️ Build Installable Android APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🔍 List Generated APK Files
        working-directory: frontend/android
        run: ls -la app/build/outputs/apk/debug/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-Pro-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
